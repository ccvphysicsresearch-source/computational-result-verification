name: Validate verification records

on:
  push:
    paths:
      - "schemas/**"
      - "papers/**/verification_record.json"
      - "scripts/validate_verification_records.py"
      - ".github/workflows/validate-records.yml"
  pull_request:
    paths:
      - "schemas/**"
      - "papers/**/verification_record.json"
      - "scripts/validate_verification_records.py"
      - ".github/workflows/validate-records.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema>=4.26,<5"

      - name: Validate verification records
        run: python scripts/validate_verification_records.py
