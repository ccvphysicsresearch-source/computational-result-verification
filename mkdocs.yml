site_name: Scientific Reproducibility
site_description: An open platform for reproducing and independently verifying scientific results.
site_url: ""

repo_url: https://github.com/ccvphysicsresearch-source/scientific-reproducibility
repo_name: scientific-reproducibility

theme:
  name: material
  logo: null
  favicon: null
  palette:
    - scheme: default
      primary: blue grey
      accent: teal
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

nav:
  - Home: index.md
  - Verification Protocol: protocol.md
  - Benchmarks:
      - Shu (1977): shu1977.md
  - Contribute: contribute.md

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
